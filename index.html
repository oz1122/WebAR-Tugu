<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebAR Eksplorasi 5 Tugu Tasikmalaya</title>

  <!-- Google Fonts (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Library A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header & Status Panduan -->
  <header class="top-bar">
    <div class="brand-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusBadge">Arahkan kamera ke Poster Marker Tugu</span>
    </div>
  </header>

  <!-- Bingkai Pemandu Scan dengan Animasi Laser -->
  <div class="scanner-frame" id="scannerFrame">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>
    <div class="scan-line"></div>
    <p class="scan-caption">Posisikan poster di dalam bingkai</p>
  </div>

  <!-- Tombol Floating Buka Kembali Info (Jika panel ditutup manual) -->
  <button class="btn-reopen hidden" id="btnReopen">
    <span>📜</span> Info Tugu
  </button>

  <!-- Panel Penjelasan Tugu (Bottom Sheet Modern) -->
  <section class="info-drawer" id="infoDrawer">
    <div class="drawer-handle"></div>

    <div class="drawer-header">
      <div class="header-badges">
        <span class="tugu-tag" id="tuguTag">TUGU 01</span>
        <span class="year-tag" id="tuguYear">1947</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btnReset" title="Reset Posisi 3D">↺</button>
        <button class="btn-icon btn-close" id="btnClose" title="Sembunyikan">&times;</button>
      </div>
    </div>

    <h2 id="tuguTitle">Nama Tugu</h2>
    <p class="tugu-location">
      <span class="loc-pin">📍</span> <span id="tuguLocation">Lokasi Tugu</span>
    </p>

    <div class="tugu-desc-box">
      <p id="tuguDesc">Penjelasan singkat mengenai sejarah dan makna tugu akan tampil di sini.</p>
    </div>

    <!-- Bar Kontrol Audio & Panduan Gestur -->
    <div class="drawer-footer">
      <button class="btn-voice" id="btnVoice">
        <span class="voice-wave" id="voiceIcon">🔊</span>
        <span id="voiceLabel">Dengarkan Narasi</span>
      </button>
      <span class="gesture-tip">1 Jari Putar • 2 Jari Zoom</span>
    </div>
  </section>

  <!-- Scene WebAR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Preload 5 Aset 3D GLB sesuai nama file Anda -->
    <a-assets timeout="1000">
      <a-asset-item id="model-0" src="./assets/Tugu-Koperasi.glb"></a-asset-item>
      <a-asset-item id="model-1" src="./assets/Tugu-Simpang-lima.glb"></a-asset-item>
      <a-asset-item id="model-2" src="./assets/Tugu-Asmaul-Husna.glb"></a-asset-item>
      <a-asset-item id="model-3" src="./assets/Tugu-Kelom-Geulis-Gobras.glb"></a-asset-item>
      <a-asset-item id="model-4" src="./assets/Tugu-LamAlif.glb"></a-asset-item>
    </a-assets>

    <!-- Pencahayaan Tambahan agar 3D Jelas -->
    <a-light type="ambient" color="#ffffff" intensity="0.95"></a-light>
    <a-light type="directional" color="#fff8eb" intensity="0.85" position="1 3 2"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Marker 1 (Index 0: Tugu Koperasi) -->
    <a-entity id="target-0" mindar-image-target="targetIndex: 0">
      <a-entity id="wrapper-0" scale="0.4 0.4 0.4" rotation="0 0 0">
        <a-gltf-model src="#model-0" position="0 0 0" rotation="90 0 0"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target Marker 2 (Index 1: Tugu Simpang Lima) -->
    <a-entity id="target-1" mindar-image-target="targetIndex: 1">
      <a-entity id="wrapper-1" scale="0.4 0.4 0.4" rotation="0 0 0">
        <a-gltf-model src="#model-1" position="0 0 0" rotation="90 0 0"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target Marker 3 (Index 2: Tugu Asmaul Husna) -->
    <a-entity id="target-2" mindar-image-target="targetIndex: 2">
      <a-entity id="wrapper-2" scale="0.4 0.4 0.4" rotation="0 0 0">
        <a-gltf-model src="#model-2" position="0 0 0" rotation="90 0 0"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target Marker 4 (Index 3: Tugu Kelom Geulis) -->
    <a-entity id="target-3" mindar-image-target="targetIndex: 3">
      <a-entity id="wrapper-3" scale="0.4 0.4 0.4" rotation="0 0 0">
        <a-gltf-model src="#model-3" position="0 0 0" rotation="90 0 0"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target Marker 5 (Index 4: Tugu Lam-Alif) -->
    <a-entity id="target-4" mindar-image-target="targetIndex: 4">
      <a-entity id="wrapper-4" scale="0.4 0.4 0.4" rotation="0 0 0">
        <a-gltf-model src="#model-4" position="0 0 0" rotation="90 0 0"></a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>

  <script src="script.js"></script>
</body>
</html>
